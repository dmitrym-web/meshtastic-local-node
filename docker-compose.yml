services:
  serial-bridge:
    image: ghcr.io/yeraze/meshtastic-serial-bridge:latest
    container_name: meshtastic-serial-bridge
    restart: unless-stopped
    privileged: true
    network_mode: host
    devices:
      - ${SERIAL_PORT}:/dev/ttyACM0
    environment:
      - SERIAL_DEVICE=/dev/ttyACM0
      - TCP_PORT=${SERIAL_BRIDGE_PORT}
      - TZ=${TZ:-Europe/Moscow}
    env_file:
      - .env

  meshmonitor:
    image: ghcr.io/yeraze/meshmonitor:latest
    container_name: meshmonitor
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./meshmonitor-data:/data
    environment:
      - MESHTASTIC_NODE_IP=localhost
      - MESHTASTIC_NODE_PORT=${SERIAL_BRIDGE_PORT}
      - PORT=${MESHMONITOR_PORT}
      - COMPOSE_PROJECT_NAME=meshmonitor
      - TZ=${TZ:-Europe/Moscow}
    depends_on:
      - serial-bridge
    env_file:
      - .env

  meshmonitor-init:
    image: alpine:latest
    container_name: meshmonitor-init
    network_mode: host
    volumes:
      - ./meshmonitor-secrets:/secrets
      - ./scripts/init-meshmonitor.sh:/init.sh:ro
    environment:
      - SERIAL_BRIDGE_PORT=${SERIAL_BRIDGE_PORT}
      - TZ=${TZ:-Europe/Moscow}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    command: ["sh", "-c", "apk add --no-cache curl jq netcat-openbsd && sh /init.sh && chown -R $$PUID:$$PGID /secrets"]
    depends_on:
      - meshmonitor
    restart: "no"

  mqtt-proxy:
    image: ghcr.io/ln4cy/mqtt-proxy:latest
    container_name: mqtt-proxy
    restart: unless-stopped
    network_mode: host
    environment:
      - INTERFACE_TYPE=tcp
      - TCP_NODE_HOST=localhost
      - TCP_NODE_PORT=${MESHMONITOR_VIRTUAL_NODE_PORT}
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_ROOT_TOPIC=${MQTT_ROOT_TOPIC}
      - TZ=${TZ:-Europe/Moscow}
    env_file:
      - .env
    depends_on:
      meshmonitor-init:
        condition: service_completed_successfully

  subscriber:
    build: ./subscriber
    container_name: mqtt-sub
    restart: unless-stopped
    network_mode: host
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./subscriber-data:/data
    env_file:
      - .env

  sender:
    build: ./sender
    container_name: mqtt-sender
    restart: unless-stopped
    network_mode: host
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-Europe/Moscow}
    volumes:
      - ./jobs:/app/jobs
      - ./scripts:/app/scripts:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    depends_on:
      meshmonitor-init:
        condition: service_completed_successfully